<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lär dig med robot</title>
  <style>
    body {
      margin: 0;
      background: #f0e6ff;
      font-family: Arial, sans-serif;
    }
    .screen {
      display: none;
      text-align: center;
      padding: 10px;
    }
    .active { display: block; }
    img {
      max-width: 100%;
      border-radius: 20px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }
    button {
      background: #7b1fa2;
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 25px;
      font-size: 16px;
      margin: 10px;
      cursor: pointer;
    }
    .nav {
      text-align: center;
      margin: 15px 0;
    }
  </style>
</head>
<body>
  <div id="home" class="screen active">
    <img src="https://images.grok.x.ai/imagine_images/uZsDy.jpg" alt="Home">
    <div class="nav">
      <button onclick="showScreen('matte')">Gå till Matte</button>
      <button onclick="showScreen('help')">Behöver du hjälp?</button>
      <button onclick="showScreen('books')">Böcker</button>
      <button onclick="showScreen('streak')">Streak</button>
    </div>
  </div>

  <div id="matte" class="screen">
    <img src="https://images.grok.x.ai/imagine_images/Vnw9m.jpg" alt="Matte">
    <div class="nav">
      <button onclick="showScreen('question')">Svara på frågorna</button>
      <button onclick="showScreen('home')">Tillbaka</button>
    </div>
  </div>

  <div id="question" class="screen">
    <img src="https://images.grok.x.ai/imagine_images/8lT5s.jpg" alt="Fråga">
    <div class="nav">
      <button onclick="alert('Rätt! Du är så smart!'); showScreen('success')">12</button>
      <button onclick="alert('Försök igen!')">10</button>
      <button onclick="alert('Försök igen!')">11</button>
      <br>
      <button onclick="showScreen('matte')">Tillbaka</button>
    </div>
  </div>

  <div id="success" class="screen">
    <img src="https://images.grok.x.ai/imagine_images/brKlB.jpg" alt="Bra jobbat">
    <div class="nav">
      <button onclick="showScreen('home')">Tillbaka till start</button>
    </div>
  </div>

  <div id="help" class="screen">
    <img src="https://images.grok.x.ai/imagine_images/iXC9p.jpg" alt="Hjälp">
    <div class="nav">
      <button onclick="showScreen('home')">Tillbaka</button>
    </div>
  </div>

  <div id="books" class="screen">
    <img src="https://images.grok.x.ai/imagine_images/pfFVs.jpg" alt="Bokhylla">
    <div class="nav">
      <button onclick="showScreen('home')">Tillbaka</button>
    </div>
  </div>

  <div id="streak" class="screen">
    <img src="https://images.grok.x.ai/imagine_images/2Esad.jpg" alt="Streak">
    <div class="nav">
      <button onclick="showScreen('home')">Tillbaka</button>
    </div>
  </div>

  <script>
    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }
  </script>
</body>
</html>
